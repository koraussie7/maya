# 고정 결정 라우트 — LLM·TTS 없이 즉답하는 경로
#
# 원칙 (jev-voice-agent / s2s.cpp)
#   응답 공간이 **유한하고 확실한** 발화만 여기에 넣는다. 그 턴은 모델도 합성도 필요 없다.
#   애매하면 넣지 말고 자유 대화로 보내라 — 오탐이 미탐보다 훨씬 나쁘다.
#
# 필드
#   id         : 식별자(로그·캐시 키)
#   say        : 말할 문장(고정). 이 문장의 음성은 최초 1회만 합성해 캐시된다
#   any        : 이 중 하나만 포함되면 매칭
#   all        : 전부 포함되어야 매칭(any 와 함께 쓸 수 있음)
#   none       : 이 중 하나라도 포함되면 제외
#   max_chars  : 발화 길이 상한(정규화 후 글자수). 넘으면 자유 대화
#   priority   : 높을수록 먼저 검사
#   anchor     : any 매칭 방식 — "end"(기본, 발화 끝) | "start" | "any"(부분 포함)
#                기본이 end 인 이유: "그만큼 말해줘" 가 stop 으로 잡히는 오탐을 막는다
#                "exact" = 발화 전체가 정확히 그 단어(짧은 백채널용)
#   action     : (선택) 실행할 동작 이름 — 지금은 로그에만 남는다
#
# 주의
#   · max_chars 를 크게 잡으면 "그만큼 말해줘" 같은 문장도 삼킨다. 짧게 유지할 것.
#   · STT 는 띄어쓰기를 흔들기 때문에 공백/문장부호는 무시하고 비교한다.
routes:
  - id: stop
    say: "응, 그만할게."
    any: ["그만", "멈춰", "스톱", "그만해", "중지"]
    max_chars: 10
    priority: 100

  - id: stop_speaking
    say: "알겠어, 멈췄어."
    any: ["조용히", "말하지마", "말하지마요", "쉿"]
    max_chars: 12
    priority: 95

  - id: repeat
    say: "다시 말해줄게."
    # anchor: start — "다시 말해줘/다시 말해줄래" 모두 잡고, 문장 끝에 붙는 경우도 포함
    any: ["다시말해", "한번더", "뭐라고"]
    max_chars: 12
    priority: 90
    anchor: start

  - id: slower
    say: "천천히 말할게."
    any: ["천천히"]
    all: ["말"]
    max_chars: 14
    priority: 85
    anchor: any

  # 확인/동의 — 아주 짧은 백채널만. "응 그럼 이거 해줘" 는 자유 대화로 보낸다.
  - id: affirm
    say: "응, 좋아."
    any: ["응", "어", "네", "그래", "좋아", "오케이", "ok"]
    max_chars: 6
    priority: 40
    anchor: exact        # "응" / "네" / "좋아" 처럼 발화 전체가 그 단어일 때만

  - id: thanks
    say: "천만에."
    any: ["고마워", "고맙습니다", "땡큐"]
    max_chars: 10
    priority: 60

  - id: hello
    say: "안녕. 부르면 바로 올게."
    any: ["안녕", "하이", "헬로"]
    max_chars: 8
    priority: 50
