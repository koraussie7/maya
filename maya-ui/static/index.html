<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Maya · 음성 비서</title>
    <meta
      name="description"
      content="Maya 음성 비서 — 한국어 STT/TTS 기반 AI 어시스턴트"
    />
    <meta name="theme-color" content="#0b0d12" />
    <link
      rel="icon"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='22' fill='%237c5cff'/></svg>"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-aurora"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Maya</span>
        <span class="brand-sub">음성 비서 · privseai.com/maya</span>
      </div>
      <div class="presence" id="presence">
        <span class="presence-dot" data-state="idle"></span>
        <span class="presence-text" data-state="idle">대기 중</span>
      </div>
    </header>

    <main class="stage">
      <!-- Voice Orb (Mizu 스타일 orb) -->
      <section class="orb-wrap" aria-label="음성 오브">
        <div
          class="orb"
          id="orb"
          data-state="idle"
          role="button"
          tabindex="0"
          aria-label="음성 입력 시작"
        >
          <div class="orb-core"></div>
          <div class="orb-ring r1"></div>
          <div class="orb-ring r2"></div>
          <div class="orb-ring r3"></div>
          <canvas
            class="orb-wave"
            id="orbWave"
            width="320"
            height="320"
          ></canvas>
        </div>
        <button class="mic-btn" id="micBtn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
            />
          </svg>
          <span class="mic-label">탭해서 말하기</span>
        </button>
      </section>

      <!-- Streaming text area -->
      <section class="chat" aria-live="polite">
        <div class="chat-empty" id="chatEmpty">
          <h1>안녕하세요, 민수님</h1>
          <p>한국어로 무엇이든 물어보세요. 마이크 버튼을 눌러 시작합니다.</p>
          <div class="suggest">
            <button class="chip" data-prompt="오늘 일정 알려줘">
              오늘 일정 알려줘
            </button>
            <button class="chip" data-prompt="내 이름이 뭐였지?">
              내 이름이 뭐였지?
            </button>
            <button class="chip" data-prompt="한국어로 짧은 시 하나 써줘">
              한국어로 짧은 시 하나 써줘
            </button>
          </div>
        </div>
        <ol class="chat-list" id="chatList" hidden></ol>
      </section>

      <!-- Text fallback input -->
      <form class="composer" id="composer">
        <input
          type="text"
          id="textInput"
          placeholder="또는 텍스트로 입력…"
          autocomplete="off"
        />
        <button type="submit" aria-label="전송">전송</button>
      </form>
    </main>

    <footer class="footer">
      <span>STT · Whisper</span><span>·</span> <span>LLM · OpenRouter</span
      ><span>·</span> <span>TTS · VoxCPM</span><span>·</span>
      <span class="mono">v0.1.0 · prototype</span>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
